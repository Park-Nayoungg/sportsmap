<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모집글 관리</title>
<link rel="stylesheet" href="./styles.css">
<script type="module" src="./js/common.js"></script>

<header class="app-header">

  <div class="actions">
    <a class="icon-btn home" href="./main.html"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">

    <div class="panel-header"><h2 class="panel-title">내 모집글</h2></div>

    <div id="postEmpty" class="meta" style="padding:12px" hidden>등록된 모집글이 없습니다.</div>
  </section>

  <section class="panel">
    <div class="panel-header"><h2 class="panel-title">신청자</h2></div>
    <div id="appList" class="list"></div>
    <div id="appEmpty" class="meta" style="padding:12px" hidden>모집글을 선택하면 신청자가 표시됩니다.</div>
  </section>
