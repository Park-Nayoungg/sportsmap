<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>게시글 등록 · 스포츠맵</title>

    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./community.css" />

    <style>
        .compose-wrap{ padding:16px; max-width:700px; margin:0 auto;}
        .form-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;}
        label{font-size:14px;font-weight:600;margin-bottom:6px;display:block;}
        select,
        input[type="text"],
        textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;background:#fff;}
        textarea{ min-height:160px; resize:vertical; }
        .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;    }
        .btn-cancel{padding:5px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:14px;color:#333;text-decoration: none;}
        .btn-submit{padding:8px 14px;background:var(--primary);border:0;border-radius:8px;color:#fff;font-size:14px;}
        @media (min-width:768px){.compose-wrap{ padding:24px; }}
    </style>

    <script type="module" src="./js/compose.js"></script>
</head>

<body>
    <header class="app-header">
        <a class="link" href="./community.html" aria-label="뒤로">←</a>
        <div class="actions">
            <a class="icon-btn home" href="./main.html" aria-label="지도 홈">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                    <path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-10.5z" fill="#10b981"/>
                </svg>
            </a>
        </div>
    </header>

    <main class="compose-wrap">
        <h1 class="panel-title" style="margin:0 0 16px;">게시글 등록</h1>

        <form id="composeForm" class="form-card" novalidate>
            <div>
                <label for="topic">주제</label>
                <select id="topic" required>
                <option value="일반">일반</option>
                <option value="후기">후기</option>
                <option value="이벤트">이벤트</option>
                </select>
            </div>

            <div>
                <label for="title">제목 (선택)</label>
                <input id="title" type="text" maxlength="80" placeholder="제목을 입력하세요 (선택)">
            </div>

            <div>
                <label for="body">내용</label>
                <textarea id="body" placeholder="내용을 입력하세요" required></textarea>
            </div>
            <div>
                <label for="images">사진 (최대 5장)</label>
                <input id="images" type="file" accept="image/*" multiple>
                <div id="preview" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px"></div>
            </div>

            <div>
                <label for="facility">시설명 (선택)</label>
                <input id="facility" type="text" placeholder="예: 강북문화예술회관">
            </div>

            <div class="actions">
                <a href="./community.html" class="btn-cancel">취소</a>
                <button type="submit" id="btnSubmit" class="btn-submit">등록</button>
            </div>
        </form>
    </main>

    <nav class="bottom-nav">
        <a href="./community.html" class="active">커뮤니티</a>
        <a href="./main.html">지도</a>
        <a href="./dailyprograms.html">일일참여</a>
        <a href="./mypage.html">마이페이지</a>
    </nav>
    <div class="spacer"></div>

</body>
</html>
