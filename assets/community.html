<!-- community.html (커뮤니티 화면) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>스포츠맵 · 커뮤니티</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./community.css" />
  <script type="module" src="./js/common.js"></script>
</head>
<body>
  <!-- 헤더(필요 없으면 이 블록 제거 가능) -->
  <header class="app-header">
    <h1 class="app-title">커뮤니티</h1>
    <div class="search"><input type="search" placeholder="모집/후기/이벤트 검색" aria-label="커뮤니티 검색" /></div>
    <div class="actions">
      <a class="icon-btn home" href="./main.html" aria-label="지도 홈">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-10.5z" fill="#10b981"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- 본문: 커뮤니티 피드 -->
  <main class="container" aria-label="커뮤니티 피드">
    <section class="panel" aria-labelledby="community-title">
      <div class="panel-header">
        <div class="comm-toolbar">
          <div class="chiprow" role="tablist" aria-label="카테고리 필터">
            <button class="chip active" role="tab" aria-selected="true">전체</button>
            <button class="chip" role="tab" aria-selected="false">후기</button>
            <button class="chip" role="tab" aria-selected="false">이벤트</button>
          </div>
          <a href="./compose.html" class="btn-write-white btn-add">게시글 등록</a>
        </div>
      </div>

      <div id="feedWrap">
        <div id="feed"></div>
      </div>
    </section>
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav" aria-label="하단 내비게이션">
    <a class="active" href="./community.html" aria-current="page">커뮤니티</a>
    <a href="./main.html">지도</a>
    <a href="./dailyprograms.html">일일참여</a>
    <a href="./mypage.html">마이페이지</a>
  </nav>

  <!-- 하단바 여백 확보 -->
  <div class="spacer" aria-hidden="true"></div>

  <!-- 스크립트는 나중에 연결 -->
  <script type="module" src="./js/community.js"></script>
</body>
</html>
